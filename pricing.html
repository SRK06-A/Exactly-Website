 <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: rgba(0,0,0,0);
      color: white;
      font-family: Arial, sans-serif;
    }

    /* The canvas sits behind everything */
    #spiralCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .content h1 {
      font-size: clamp(3rem, 8vw, 7rem);
      letter-spacing: -0.05em;

      text-shadow:
        0 0 20px rgba(62, 80, 133, 0.8),
        0 0 60px rgba(158, 0, 0, 0.4);
    }
  </style>





        <canvas id="spiralCanvas"></canvas>

  <script>
    const canvas = document.getElementById("spiralCanvas");
    const ctx = canvas.getContext("2d");

    let width;
    let height;
    let centerX;
    let centerY;

    let rotation = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      centerX = width / 2;
      centerY = height / 2;
    }

    window.addEventListener("resize", resize);
    resize();


    function drawSpiral() {

      // Dark background
      ctx.fillStyle = "rgba:(0,0,0,0)";
      ctx.fillRect(0, 0, width, height);

      ctx.save();

      ctx.translate(centerX, centerY);
      ctx.rotate(rotation);

      /*
        Draw several spirals on top of each other.
        This gives the effect more depth.
      */
      for (let layer = 0; layer < 3; layer++) {

        ctx.beginPath();

        const maxRadius = Math.max(width, height) * 0.9;

        for (let i = 0; i < 900; i++) {

          const t = i / 900;

          // Radius grows outward
          const radius = t * maxRadius;

          // Number of turns
          const angle =
            t * Math.PI * 18 +
            layer * Math.PI * 2 / 3;

          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;

          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        // Glowing colors
        const colors = [
          "rgba(62, 80, 133, 0.38)",
          "rgba(158, 0, 0, 0.28)",
          "rgba(255, 255, 255, 0.32)"
        ];

        ctx.strokeStyle = colors[layer];
        ctx.lineWidth = 60 + layer;

        ctx.shadowBlur = 0;
        ctx.shadowColor = colors[layer];

        ctx.stroke();
      }

      ctx.restore();

      // Slowly rotate the entire spiral
      rotation += 0.0118;

      requestAnimationFrame(drawSpiral);
    }

    drawSpiral();
  </script>
